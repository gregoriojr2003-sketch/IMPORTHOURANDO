# ==============================================================================
# IMPORTHOURANDO - WORKFLOW DE CI/CD PARA HOSTINGER (FTP DEPLOY AUTOMÁTICO)
# ==============================================================================
# Este fluxo de trabalho do GitHub Actions automatiza o processo de build do projeto
# e faz o deploy dos arquivos estáticos gerados na pasta 'dist' diretamente para o
# diretório 'public_html' da hospedagem Hostinger via FTP seguro.
#
# COMO CONFIGURAR AS SECRETS NO SEU REPOSITÓRIO GITHUB:
# 1. No seu repositório no GitHub, vá em Settings -> Secrets and variables -> Actions
# 2. Clique no botão "New repository secret" e adicione cada uma das 3 chaves abaixo:
#    - Nome: FTP_SERVER   | Valor: ftp.seu-dominio.com.br (ou o IP do servidor Hostinger)
#    - Nome: FTP_USERNAME | Valor: seu_usuario_ftp (criado no painel hPanel da Hostinger)
#    - Nome: FTP_PASSWORD | Valor: sua_senha_ftp_segura
# ==============================================================================

name: Build and Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & FTP Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout do código-fonte do repositório
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configuração do ambiente Node.js (v20)
      - name: ⚙️ Setup Node.js v20
        uses: actions/checkout@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Instalação das dependências e compilação do projeto
      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Web Application
        run: npm run build
        env:
          NODE_ENV: production

      # Step 4: Deploy automático dos arquivos compilados em 'dist' para 'public_html' na Hostinger
      - name: 🚀 FTP Deploy to Hostinger (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false
          log-level: standard
